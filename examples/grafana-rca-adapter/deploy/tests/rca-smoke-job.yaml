# Контракт тестового исполняемого файла релиза. В этом примере нет его реализации.
# /app/bin/rca-smoke читает connection.yaml и получает по SMOKE_FIXTURE_ID
# тестовый источник зарегистрированного подключения в PROFILE_API_BASE_URL.
# PROFILE_API_TOKEN даёт чтение реестра настроек проекта. Отдельный
# SMOKE_TRIGGER_TOKEN разрешает изменить сигнал тестового источника.
# Источник принимает SMOKE_RUN_ID как ключ для одной проверки, в том числе
# при повторе после обрыва. Grafana вычисляет выбранное правило, переводит его
# в firing и отправляет событие адаптеру через настроенный контакт.
# Тест читает статус RCA и квитанцию канала. Создание RCA выполняет адаптер.
# Повтор установки сохраняет этот Job и его результат. Для намеренного нового
# теста IDP задаёт новый SMOKE_RUN_ID и создаёт Job с новым именем. Пример
# для этого Job: SMOKE_RUN_ID=conn-checkout-01-smoke-1.
# Код 0 возможен только после completed и квитанции выбранного канала,
# содержащих идентификатор одного и того же тестового запуска и подключения.
# Ошибка и истечение срока завершают тест с ненулевым кодом.
# Для выполнения нужны настоящий образ, тестовое правило и профиль проекта.
apiVersion: batch/v1
kind: Job
metadata:
  name: rca-conn-checkout-01-smoke-1
  labels:
    app.kubernetes.io/name: grafana-rca-smoke
    app.kubernetes.io/instance: rca-conn-checkout-01
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-rca-smoke
        app.kubernetes.io/instance: rca-conn-checkout-01
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: smoke
          image: registry.example.invalid/sre-agents/grafana-rca-adapter@sha256:9af3b160d84c25e79af3b160d84c25e79af3b160d84c25e79af3b160d84c25e7
          command:
            - /app/bin/rca-smoke
          args:
            - --timeout=5m
          env:
            - name: CONNECTION_CONFIG_PATH
              value: /etc/adapter/connection.yaml
            - name: SMOKE_RUN_ID
              valueFrom:
                configMapKeyRef:
                  name: rca-conn-checkout-01-config
                  key: SMOKE_RUN_ID
            - name: PROFILE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: rca-conn-checkout-01-config
                  key: PROFILE_API_BASE_URL
            - name: SMOKE_FIXTURE_ID
              valueFrom:
                configMapKeyRef:
                  name: rca-conn-checkout-01-config
                  key: SMOKE_FIXTURE_ID
            - name: PROFILE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rca-conn-checkout-01-secrets
                  key: PROFILE_API_TOKEN
            - name: SMOKE_TRIGGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rca-conn-checkout-01-secrets
                  key: SMOKE_TRIGGER_TOKEN
            - name: DELIVERY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rca-conn-checkout-01-secrets
                  key: DELIVERY_API_TOKEN
            - name: RCA_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: rca-conn-checkout-01-config
                  key: RCA_API_BASE_URL
            - name: RCA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rca-conn-checkout-01-secrets
                  key: RCA_API_TOKEN
          volumeMounts:
            - name: connection
              mountPath: /etc/adapter
              readOnly: true
      volumes:
        - name: connection
          configMap:
            name: rca-conn-checkout-01-config
            items:
              - key: connection.yaml
                path: connection.yaml
